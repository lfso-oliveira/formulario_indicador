<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin — envios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --border: #2d3a4d;
      --text: #e8eef5;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-hover: #5a9fff;
      --danger: #e85d5d;
      --ok: #6ecf8f;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: radial-gradient(ellipse 100% 70% at 100% 0%, #2a1a3d 0%, var(--bg) 45%);
      color: var(--text);
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(1.2rem, 4vw, 1.45rem);
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }
    a.back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    a.back:hover { color: var(--accent); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      touch-action: manipulation;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      font-size: 0.9rem;
      margin-bottom: 1rem;
      min-height: 1.3em;
    }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .msg.muted { color: var(--muted); }
    .lista { display: flex; flex-direction: column; gap: 1rem; }
    article.envio {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      box-shadow: 0 6px 28px rgba(0,0,0,0.28);
    }
    .envio-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: baseline;
      margin-bottom: 0.65rem;
    }
    .envio-head time {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .envio-head strong {
      font-size: 1rem;
    }
    .envio-id {
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
    }
    details.detalhe {
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.65rem;
    }
    details.detalhe summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--accent);
    }
    .mini-wrap { overflow-x: auto; margin-top: 0.75rem; }
    table.mini {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .mini th, .mini td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.45rem;
      text-align: left;
      vertical-align: top;
    }
    .mini th {
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
    }
    .cel-resumo {
      font-size: 0.75rem;
      line-height: 1.35;
      max-width: 220px;
    }
    .aviso {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 2rem;
      padding: 1rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <h1>Envios recebidos</h1>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center">
        <button type="button" class="btn" id="btn-atualizar">Atualizar</button>
        <a class="back" href="../">← Formulário público</a>
      </div>
    </div>
    <p class="msg muted" id="msg" aria-live="polite"></p>
    <div class="lista" id="lista"></div>
    <p class="aviso">
      Usa o mesmo <code>config.js</code> da raiz (<strong>url</strong> + <strong>anonKey</strong>) que o formulário.
      Com a política SQL atual, quem tiver a chave anon pode <strong>ler todos os envios</strong> — trate o link <code>/admin/</code> como não público ou proteja o alojamento.
    </p>
  </div>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <script>
    (function () {
      var TABLE = "indicadores_envios";
      var lista = document.getElementById("lista");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn-atualizar");
      var client = null;

      function getClient() {
        if (client) return client;
        var C = window.INDICADORES_SUPABASE || {};
        var url = (C.url || "").trim();
        var key = (C.anonKey || "").trim();
        if (!url || !key) return null;
        if (!window.supabase || typeof window.supabase.createClient !== "function") return null;
        client = window.supabase.createClient(url, key);
        return client;
      }

      function setMsg(text, kind) {
        msg.textContent = text || "";
        msg.className = "msg" + (kind ? " " + kind : "");
      }

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtHoras(hi, hf) {
        hi = (hi || "").trim();
        hf = (hf || "").trim();
        if (hi && hf) return hi + " – " + hf;
        if (hi || hf) return hi || hf;
        return "—";
      }

      function migrateLinhaLegacy(r) {
        if (!r || typeof r !== "object") return r;
        if (r.sexta && ("horaInicio" in r.sexta || "horaFim" in r.sexta)) return r;
        var hi = r.horaInicio || "";
        var hf = r.horaFim || "";
        return {
          sexta: Object.assign({ horaInicio: hi, horaFim: hf }, r.sexta || {}),
          sabado: Object.assign({ horaInicio: hi, horaFim: hf }, r.sabado || {}),
          domingo: Object.assign({ horaInicio: hi, horaFim: hf }, r.domingo || {}),
        };
      }

      /** Novo formato: { sexta: [], sabado: [], domingo: [] }; antigo: array de linhas com três dias. */
      function normalizeLinhasToDias(linhas) {
        if (!linhas) return { sexta: [], sabado: [], domingo: [] };
        if (typeof linhas === "string") {
          try {
            linhas = JSON.parse(linhas);
          } catch (e) {
            return { sexta: [], sabado: [], domingo: [] };
          }
        }
        if (linhas && typeof linhas === "object" && !Array.isArray(linhas) && Array.isArray(linhas.sexta)) {
          return {
            sexta: (linhas.sexta || []).slice(),
            sabado: (linhas.sabado || []).slice(),
            domingo: (linhas.domingo || []).slice(),
          };
        }
        var arr = Array.isArray(linhas) ? linhas : [];
        var out = { sexta: [], sabado: [], domingo: [] };
        for (var i = 0; i < arr.length; i++) {
          var r = migrateLinhaLegacy(arr[i] || {});
          out.sexta.push(r.sexta || {});
          out.sabado.push(r.sabado || {});
          out.domingo.push(r.domingo || {});
        }
        return out;
      }

      function buildTabelaUmDia(titulo, linhas) {
        var block = document.createElement("div");
        block.style.marginTop = "0.85rem";
        var h = document.createElement("h4");
        h.textContent = titulo;
        h.style.margin = "0 0 0.45rem";
        h.style.fontSize = "0.88rem";
        h.style.fontWeight = "600";
        h.style.color = "var(--text, #e8eef5)";
        block.appendChild(h);
        if (!linhas || !linhas.length) {
          var empty = document.createElement("p");
          empty.className = "muted";
          empty.style.fontSize = "0.82rem";
          empty.style.margin = "0";
          empty.textContent = "Sem turnos neste dia.";
          block.appendChild(empty);
          return block;
        }
        var wrap = document.createElement("div");
        wrap.className = "mini-wrap";
        var table = document.createElement("table");
        table.className = "mini";
        var thead = document.createElement("thead");
        thead.innerHTML =
          "<tr><th>Horário</th><th>Nome</th><th>Congregação</th><th>Contato</th></tr>";
        table.appendChild(thead);
        var tb = document.createElement("tbody");
        for (var i = 0; i < linhas.length; i++) {
          var c = linhas[i] || {};
          var tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" +
            esc(fmtHoras(c.horaInicio, c.horaFim)) +
            "</td><td class=\"cel-resumo\">" +
            esc((c.nome || "").trim() || "—") +
            "</td><td class=\"cel-resumo\">" +
            esc((c.congregacao || "").trim() || "—") +
            "</td><td class=\"cel-resumo\">" +
            esc((c.contato || "").trim() || "—") +
            "</td>";
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        wrap.appendChild(table);
        block.appendChild(wrap);
        return block;
      }

      function renderLinhas(linhas) {
        var dias = normalizeLinhasToDias(linhas);
        var root = document.createElement("div");
        root.appendChild(buildTabelaUmDia("Sexta-feira", dias.sexta));
        root.appendChild(buildTabelaUmDia("Sábado", dias.sabado));
        root.appendChild(buildTabelaUmDia("Domingo", dias.domingo));
        return root;
      }

      function renderLista(rows) {
        lista.innerHTML = "";
        if (!rows || !rows.length) {
          var empty = document.createElement("p");
          empty.className = "msg muted";
          empty.textContent = "Ainda não há envios.";
          lista.appendChild(empty);
          return;
        }
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          var art = document.createElement("article");
          art.className = "envio";
          var head = document.createElement("div");
          head.className = "envio-head";
          var cap = row.capitao != null && String(row.capitao).trim() ? String(row.capitao).trim() : "(sem nome de capitão)";
          var t = document.createElement("strong");
          t.textContent = cap;
          head.appendChild(t);
          var time = document.createElement("time");
          time.dateTime = row.created_at || "";
          time.textContent = row.created_at
            ? new Date(row.created_at).toLocaleString("pt-BR", {
                dateStyle: "short",
                timeStyle: "short",
              })
            : "";
          head.appendChild(time);
          art.appendChild(head);
          var idp = document.createElement("p");
          idp.className = "envio-id";
          idp.textContent = "id: " + (row.id || "");
          art.appendChild(idp);
          var det = document.createElement("details");
          det.className = "detalhe";
          var sum = document.createElement("summary");
          sum.textContent = "Ver turnos por dia";
          det.appendChild(sum);
          det.appendChild(renderLinhas(row.linhas));
          art.appendChild(det);
          lista.appendChild(art);
        }
      }

      function carregar() {
        var c = getClient();
        if (!c) {
          setMsg("Defina url e anonKey no config.js da raiz (copie de config.example.js).", "err");
          lista.innerHTML = "";
          return;
        }
        btn.disabled = true;
        setMsg("A carregar…", "muted");
        c.from(TABLE)
          .select("id, capitao, linhas, created_at")
          .order("created_at", { ascending: false })
          .then(function (res) {
            btn.disabled = false;
            if (res.error) {
              setMsg(res.error.message, "err");
              lista.innerHTML = "";
              return;
            }
            setMsg(res.data && res.data.length ? res.data.length + " envio(s)." : "Nenhum envio.", "ok");
            renderLista(res.data || []);
          });
      }

      btn.addEventListener("click", carregar);
      carregar();
    })();
  </script>
</body>
</html>
